# Publishes greeclimate-davo22 to PyPI via Trusted Publishing (OIDC, no API token).
# Runs automatically when a GitHub release is published, or manually for a given tag.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to build and publish (e.g. 2.4.0)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - name: Check that the package version matches the tag
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="$(python - <<'PY'
          import configparser
          c = configparser.ConfigParser()
          c.read("setup.cfg")
          print(c["metadata"]["version"])
          PY
          )"
          echo "tag=$TAG version=$VERSION"
          test "$TAG" = "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/greeclimate-davo22
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
